name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: java-cicd-demo
  # EDIT THESE two values after creating your SonarCloud project
  SONAR_ORGANIZATION: your-sonarcloud-org-key
  SONAR_PROJECT_KEY: your-sonarcloud-project-key

jobs:
  # 1. Build and test
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test
        run: mvn -B clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports

  # 2. Code analysis (composite action)
  sonar-analysis:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for Sonar)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sonar scan
        uses: ./.github/actions/sonarqube-scan
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          organization: ${{ env.SONAR_ORGANIZATION }}
          project-key: ${{ env.SONAR_PROJECT_KEY }}

  # 3. Docker build + push + Trivy scan (one reusable workflow)
  docker-and-trivy:
    needs: sonar-analysis
    if: github.event_name == 'push'
    uses: ./.github/workflows/docker-build-scan.yml
    with:
      image-name: java-cicd-demo
      image-tag: ${{ github.sha }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
