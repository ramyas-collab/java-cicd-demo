name: Docker Build, Push and Trivy Scan (reusable)

on:
  workflow_call:
    inputs:
      image-name:
        description: Image repository name (without the Docker Hub username)
        required: true
        type: string
      image-tag:
        description: Tag to push and scan
        required: true
        type: string
      severity:
        description: Trivy severities to report
        required: false
        type: string
        default: "HIGH,CRITICAL"
      trivy-exit-code:
        description: "1 = fail when vulnerabilities are found, 0 = report only"
        required: false
        type: string
        default: "1"
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image-name }}:${{ inputs.image-tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image-name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy-scan:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image-name }}:${{ inputs.image-tag }}
          format: table
          severity: ${{ inputs.severity }}
          exit-code: ${{ inputs.trivy-exit-code }}
          ignore-unfixed: true
