name: Docker Build, Push, Trivy Scan and Artifactory Push (reusable)

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      image-tag:
        required: true
        type: string
      severity:
        required: false
        type: string
        default: "HIGH,CRITICAL"
      critical-threshold:
        description: "Max allowed CRITICAL vulnerabilities before failing"
        required: false
        type: string
        default: "0"
      artifactory-maven-repo:
        description: "Artifactory repo key for the jar"
        required: true
        type: string
      artifactory-docker-registry:
        description: "Artifactory Docker registry host, e.g. your-instance.jfrog.io/docker-local"
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      JF_URL:
        required: true
      JF_USER:
        required: true
      JF_ACCESS_TOKEN:
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image-name }}:${{ inputs.image-tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image-name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy-scan:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Scan image with Trivy (JSON report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image-name }}:${{ inputs.image-tag }}
          format: json
          output: trivy-report.json
          severity: ${{ inputs.severity }}
          ignore-unfixed: true
          exit-code: "0"   # never fail here — the threshold step below decides pass/fail

      - name: Show human-readable Trivy report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image-name }}:${{ inputs.image-tag }}
          format: table
          severity: ${{ inputs.severity }}
          ignore-unfixed: true
          exit-code: "0"

      - name: Enforce CRITICAL vulnerability threshold
        run: |
          CRITICAL_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-report.json)
          echo "CRITICAL vulnerabilities found: $CRITICAL_COUNT"
          echo "Allowed threshold: ${{ inputs.critical-threshold }}"
          if [ "$CRITICAL_COUNT" -gt "${{ inputs.critical-threshold }}" ]; then
            echo "❌ CRITICAL count ($CRITICAL_COUNT) exceeds threshold (${{ inputs.critical-threshold }})"
            exit 1
          fi
          echo "✅ CRITICAL count is within threshold"

  push-to-artifactory:
    needs: [build-and-push, trivy-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ secrets.JF_URL }}
          JF_USER: ${{ secrets.JF_USER }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

      - name: Upload jar to Artifactory
        run: |
          jf rt upload "target/*.jar" \
            "${{ inputs.artifactory-maven-repo }}/com/example/${{ inputs.image-name }}/${{ inputs.image-tag }}/" \
            --build-name="${{ inputs.image-name }}" \
            --build-number="${{ inputs.image-tag }}"

      - name: Log in to Docker Hub (to pull the scanned image)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull scanned image
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image-name }}:${{ inputs.image-tag }}

      - name: Tag image for Artifactory
        run: |
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image-name }}:${{ inputs.image-tag }} \
            ${{ inputs.artifactory-docker-registry }}/${{ inputs.image-name }}:${{ inputs.image-tag }}

      - name: Log in to Artifactory Docker registry
        run: |
          echo "${{ secrets.JF_ACCESS_TOKEN }}" | docker login ${{ inputs.artifactory-docker-registry }} \
            -u ${{ secrets.JF_USER }} --password-stdin

      - name: Push image to Artifactory
        run: |
          jf docker push ${{ inputs.artifactory-docker-registry }}/${{ inputs.image-name }}:${{ inputs.image-tag }} \
            --build-name="${{ inputs.image-name }}" \
            --build-number="${{ inputs.image-tag }}"

      - name: Publish build info to Artifactory
        run: jf rt build-publish "${{ inputs.image-name }}" "${{ inputs.image-tag }}"
